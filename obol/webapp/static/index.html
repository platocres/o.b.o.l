<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>O.B.O.L · console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230D1220'/%3E%3Ctext x='8' y='12' font-size='11' text-anchor='middle' fill='%2338BDF8'%3E%E2%97%86%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand" title="Offensive Box Operations Ledger">
      <span class="brand-mark">◆</span>
      <span class="brand-text">O.B.O.L</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-act="view" data-view="engagement"><span class="ni-ic">◉</span><span>Overview</span></button>
      <button class="nav-item" data-act="view" data-view="targets"><span class="ni-ic">⊞</span><span>Targets</span></button>
      <button class="nav-item" data-act="view" data-view="tools"><span class="ni-ic">⚒</span><span>Tools</span></button>
      <button class="nav-item" data-act="view" data-view="engpath"><span class="ni-ic">⌖</span><span>Attack path</span></button>
      <button class="nav-item" data-act="view" data-view="report"><span class="ni-ic">▤</span><span>Report</span></button>
    </nav>
    <div class="rail-foot">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting…</span></div>
    </div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <select id="eng-select" class="eng-select" title="Active engagement" data-act="eng-activate"></select>
      <button id="eng-new" class="btn ghost sm" title="New engagement" data-act="eng-new">＋</button>
      <span class="crumb" id="crumb"></span>
      <span class="spacer"></span>
      <span class="flash" id="flash">live update ✓</span>
    </header>
    <section class="content" id="content"><div class="loading">Loading…</div></section>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>

<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/vendor/morphdom-umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
